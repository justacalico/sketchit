spec:
  inputs:
    build_android:
      type: boolean
      default: false
      description: 'Also build an Android APK artifact'
---

default:
  tags: [linux-truenas]

stages:
  - build
  - release

variables:
  GLAB_ENABLE_CI_AUTOLOGIN: "true"
  GLAB_VERSION: "1.113.0"
  GIT_DEPTH: "1"
  GIT_STRATEGY: "fetch"

test:
  stage: build
  image: ghcr.io/cirruslabs/flutter:stable
  script:
    - flutter pub get
    - flutter analyze
    - flutter test --coverage
  artifacts:
    when: always
    paths:
      - coverage/lcov.info
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

pages:
  stage: build
  image: ghcr.io/cirruslabs/flutter:stable
  script:
    # Pages unique domains serve the site at /, not /$CI_PROJECT_NAME/.
    - flutter build web --release --base-href "/"
    - mv build/web public
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

build:android:
  stage: build
  image: ghcr.io/cirruslabs/flutter:stable
  script:
    - flutter build apk --release
    - mv build/app/outputs/flutter-apk/app-release.apk sketchit.apk
  artifacts:
    paths:
      - sketchit.apk
  rules:
    - if: $CI_PIPELINE_SOURCE == "web" && $[[ inputs.build_android ]]
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/

release:
  stage: release
  image: alpine:3.19
  needs: [build:android]
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/
  before_script:
    - apk add --no-cache curl tar
    - curl -fsSL -o /tmp/glab.tar.gz "https://gitlab.com/gitlab-org/cli/-/releases/v${GLAB_VERSION}/downloads/glab_${GLAB_VERSION}_linux_amd64.tar.gz"
    - tar -xzf /tmp/glab.tar.gz -C /tmp
    - install -m 755 /tmp/bin/glab /usr/local/bin/glab
  script:
    - glab release create "$CI_COMMIT_TAG" --name "$CI_COMMIT_TAG" --notes "Release $CI_COMMIT_TAG" ./sketchit.apk || glab release create "$CI_COMMIT_TAG" --name "$CI_COMMIT_TAG" --notes "Release $CI_COMMIT_TAG"
