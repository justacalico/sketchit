spec:
  inputs:
    build_android:
      type: boolean
      default: false
      description: 'Also build an Android APK artifact'
---

default:
  tags: [linux-truenas]

stages:
  - build
  - release

variables:
  GLAB_ENABLE_CI_AUTOLOGIN: "true"
  GLAB_VERSION: "1.113.0"
  GIT_DEPTH: "1"
  GIT_STRATEGY: "fetch"

test:
  stage: build
  image: ghcr.io/cirruslabs/flutter:stable
  script:
    - flutter pub get
    - flutter analyze
    - flutter test --coverage
  artifacts:
    when: always
    paths:
      - coverage/lcov.info
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

pages:
  stage: build
  image: ghcr.io/cirruslabs/flutter:stable
  script:
    # Pages unique domains serve the site at /, not /$CI_PROJECT_NAME/.
    - flutter build web --release --base-href "/"
    - mv build/web public
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

build:android:
  stage: build
  image: ghcr.io/cirruslabs/flutter:stable
  script:
    - flutter build apk --release
    - mv build/app/outputs/flutter-apk/app-release.apk sketchit.apk
  artifacts:
    paths:
      - sketchit.apk
  rules:
    - if: $CI_PIPELINE_SOURCE == "web" && $[[ inputs.build_android ]]
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/

release:
  stage: release
  image: alpine:3.19
  needs: [build:android]
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/
  before_script:
    - apk add --no-cache bash curl tar
    - bash scripts/install-glab.sh
  script:
    - glab release create "$CI_COMMIT_TAG" --name "$CI_COMMIT_TAG" --notes-file CHANGELOG.md ./sketchit.apk || glab release create "$CI_COMMIT_TAG" --name "$CI_COMMIT_TAG" ./sketchit.apk

# Watches pushes to main and lets cocogitto cut a version bump + tag when
# conventional commits warrant one. The tag push starts the tag pipeline
# that builds assets and publishes the release.
auto-release:
  stage: release
  image: alpine:3.19
  resource_group: auto-release
  timeout: 30m
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  variables:
    COCOGITTO_VERSION: "7.0.0"
    GIT_DEPTH: "0"
  before_script:
    - apk add --no-cache bash curl git
    - curl -fsSL --retry 3 -o /tmp/cog.tar.gz "https://github.com/cocogitto/cocogitto/releases/download/${COCOGITTO_VERSION}/cocogitto-${COCOGITTO_VERSION}-x86_64-unknown-linux-musl.tar.gz"
    - mkdir -p /tmp/cog && tar -xzf /tmp/cog.tar.gz -C /tmp/cog
    - install -m 755 /tmp/cog/x86_64-unknown-linux-musl/cog /usr/local/bin/cog
    - git config user.name "GitLab CI"
    - git config user.email "ci@gitlab.com"
    # A project access token is required because main is a protected branch.
    - git remote set-url origin "https://oauth2:${GITLAB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
  script:
    - bash scripts/auto-release.sh
